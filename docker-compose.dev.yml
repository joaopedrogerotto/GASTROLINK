services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver-gastrolink

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_PASSWORD}

    ports:
      - "1433:1433"

    volumes:
      - sqlserver-data:/var/opt/mssql

    restart: unless-stopped

  api:
    image: mcr.microsoft.com/dotnet/sdk:9.0

    container_name: api-gastrolink

    working_dir: /src

    volumes:
      - ./APIGastroLink:/src

    ports:
      - "8080:8080"

    command: dotnet watch run --urls http://+:8080

    environment:
      ASPNETCORE_URLS: http://+:8080

      ConnectionStrings__DefaultConnection: >
        Server=sqlserver;
        Database=GastroLink;
        User Id=sa;
        Password=${MSSQL_PASSWORD};
        TrustServerCertificate=True;

    depends_on:
      - sqlserver

  mvc:
    image: mcr.microsoft.com/dotnet/sdk:9.0

    container_name: mvc-gastrolink

    working_dir: /src

    volumes:
      - ./GastroLink:/src
      - dataprotection-keys:/root/.aspnet/DataProtection-Keys 

    ports:
      - "7200:8080"

    command: dotnet watch run --urls http://+:8080

    environment:
      ASPNETCORE_URLS: http://+:8080

      ApiGastroLink__BaseUrl: http://api:8080/api-gastrolink/
      ApiGastroLink__BaseUrlImagem: http://api:8080/

    depends_on:
      - api

volumes:
  sqlserver-data:
  dataprotection-keys:

